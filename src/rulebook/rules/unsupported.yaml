    status: draft
    source: ui/barcode
    target: designer verification
    evidence: encoding parameters are not fully expressed in XFA
    origin: {type: reference_pair, refs: ["17-0574", "18-1026"]}
    fixtures: ["17-0574", "18-1026"]
    implemented_in: []
    gates: [G6]
    reviewed_by: null
