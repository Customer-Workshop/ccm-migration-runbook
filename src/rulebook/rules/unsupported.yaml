    origin: {type: reference_pair, refs: ["18-1026"]}
    fixtures: ["18-1026"]
    implemented_in: [converters.xdp_to_cim.statics.draw_content]
    gates: [G2]
    reviewed_by: null
    reviewed_on: null
  - id: UNS-10
    title: Revision drift between the XDP and the business form the target was built from
