  - id: D-030
    node: ".EFormsData.EFTA.PAYER.Mainsectionform.Payersign.OwnerSig"
    finding: VAL-SCRIPT-MANUAL
    action: drop_script
    proposal: "drop both OwnerSig scripts (initialize prefill from OwnerData.*OwnerNam, exit write-back via assignNode)"
    rationale: >-
      initialize copies persOwnerNam / busOwnerNam / trustOwnerNam into the signature field when
      ownerPrefill != 'N'; exit writes the typed value back into the data DOM. Both are capture-channel
      behaviour (VAL-07 / VAL-09); a composed document has no exit event, and the prefill is a compose-time
      data question for the D-031 design
    status: proposed
    decided_by: null
    decided_on: null
  - id: D-031
    node: ".EFormsData.EFTA.PAYER.Mainsectionform.Payersign.OwnerSig"
    finding: UNS-SIGNATURE
    action: manual_design
    proposal: "designer places the target's e-sign visibility mechanism for the payer signature, using PayerEsignInfo / PayerSignature"
    rationale: >-
      ui/signature has no compose-time analogue (UNS-07); the target export already contains PayerSignature,
      PayerEsignInfo, eSignInfo and SupervisorEsignInfo variables, so the target design for this form has
      an e-sign construct that must be reproduced by hand
    status: proposed
    decided_by: null
    decided_on: null
