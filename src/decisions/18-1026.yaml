  - id: D-001
    node: ".EFormsData.EFTA.PAYER.Billaccno"
    finding: G3-UNBOUND
    action: bind_to_element
    proposal: "element billing_account.isa_num -> target variable isaNum (EFTAuth BillingAcctNum_FormControl)"
    rationale: >-
      caption 'BILLING ACCOUNT NUMBER'; the field's initialize script reads
      EFormsData.InsuranceServiceAccount.isaNum..isaNum6; target export has data variable isaNum and
      FormControl 'EFTAuth BillingAcctNum_FormControl' (G4 score 0.923)
    status: proposed
    decided_by: null
    decided_on: null
  - id: D-002
    node: ".EFormsData.EFTA.PAYER.Billaccno"
    finding: VAL-SCRIPT-MANUAL
    action: translate_script
    proposal: >-
      compose-time expression: join non-empty InsuranceServiceAccount.isaNum, isaNum2..isaNum6 with ', '
      into the Billaccno display value
    rationale: >-
      initialize script (1488 chars, classified unknown) is a pure concatenation of up to six sibling
      account numbers separated by ', '; no host API, no network; the target static text contains the
      target-only token 'accounts' (G0), consistent with a multi-account display. Translation must be
      written by the designer, not derived from the script body
    status: proposed
    decided_by: null
    decided_on: null
